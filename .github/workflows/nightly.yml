name: Nightly Build

on:
  schedule:
    - cron: '0 6 * * *'  # 2:00 AM ET (UTC-4) / 2:00 AM CT would be '0 7 * * *'
  workflow_dispatch:       # Allow manual triggers

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for changes in the last 24 hours
      id: check
      run: |
        CHANGES=$(git log --since="24 hours ago" --oneline --no-merges)
        if [ -z "$CHANGES" ]; then
          echo "No changes in the last 24 hours — skipping build"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "Changes found:"
          echo "$CHANGES"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

  build-and-test:
    runs-on: windows-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Test (unit + integration)
      run: dotnet test --no-build -c Release --verbosity normal --filter "Category!=UI"

    - name: Publish
      run: >
        dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:Version=0.0.0-nightly.${{ github.run_number }}
        -o publish

    - name: Remove PDB files
      run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

    - name: Zip nightly build
      run: Compress-Archive -Path publish/* -DestinationPath TCGProxyBuilder-nightly-${{ github.run_number }}-win-x64.zip

    - name: Delete previous nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete nightly --yes --cleanup-tag || true

    - name: Create nightly pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly Build #${{ github.run_number }}"
        prerelease: true
        body: |
          Automated nightly build from `main` branch.
          Built from commit ${{ github.sha }}.

          **This is a development build and may be unstable.**
        files: TCGProxyBuilder-nightly-${{ github.run_number }}-win-x64.zip

    - name: Upload nightly artifact
      uses: actions/upload-artifact@v4
      with:
        name: TCGProxyBuilder-nightly-${{ github.run_number }}
        path: TCGProxyBuilder-nightly-${{ github.run_number }}-win-x64.zip
        retention-days: 7
