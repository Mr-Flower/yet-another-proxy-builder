name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # permette al sync workflow di triggerarlo esplicitamente

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          # Triggered by tag push or dispatch --ref vX.Y.Z → GITHUB_REF_NAME is the tag.
          # Triggered by dispatch from the GitHub UI (defaults to main branch) →
          # GITHUB_REF_NAME is "main"; fall back to the latest git tag instead.
          if echo "$GITHUB_REF_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::error::Cannot determine version: ref is '$GITHUB_REF_NAME' and no git tags found."
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "Note: ref '$GITHUB_REF_NAME' is not a semver tag — using latest tag $TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish
        run: >
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -o publish

      - name: Remove PDB files
        run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/* -DestinationPath "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

  build-linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if echo "$GITHUB_REF_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::error::Cannot determine version: ref is '$GITHUB_REF_NAME' and no git tags found."
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "Note: ref '$GITHUB_REF_NAME' is not a semver tag — using latest tag $TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget libfontconfig1 libgl1

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish (native Linux)
        run: |
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -o publish

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          mkdir -p AppDir
          cp -r publish/* AppDir/

          # SkiaSharp.NativeAssets.Linux.NoDependencies is now an explicit csproj
          # reference so libSkiaSharp.so should always be in the publish output.
          # Fail loudly if it is missing rather than silently using the wrong version.
          if [ ! -f AppDir/libSkiaSharp.so ]; then
            echo "ERROR: libSkiaSharp.so not found in publish output." >&2
            echo "Make sure SkiaSharp.NativeAssets.Linux.NoDependencies 3.119.4 is in the csproj." >&2
            exit 1
          fi

          # Confirm the bundled version is 3.x (119.x), not 2.88.x.
          # strings + grep for the version symbol skia embeds in the binary.
          BUNDLED_VER=$(strings AppDir/libSkiaSharp.so 2>/dev/null | grep -oP 'SKIA_VERSION=[0-9]+' | head -1 || true)
          echo "Bundled libSkiaSharp.so version marker: ${BUNDLED_VER:-unknown}"
          ls -lh AppDir/libSkiaSharp.so

      - name: Bundle native dependencies and fix RPATH
        run: |
          sudo apt-get install -y patchelf

          # SkiaSharp.NativeAssets.Linux.NoDependencies (despite its name) dynamically
          # links against libfontconfig, libfreetype, libbrotli, libpng, etc.
          # On Arch/CachyOS these may be at different versions, causing libSkiaSharp.so
          # to fail to load silently and fall back to the system's old v88.
          #
          # Fix: bundle every non-glibc transitive dependency into AppDir, then patch
          # RPATH on libSkiaSharp.so (and key CLR binaries) to $ORIGIN so the bundled
          # versions are always found first, on any distro.

          bundle_deps() {
            local lib="$1"
            ldd "$lib" 2>/dev/null | grep -oP '/[^ ]+\.so[^ ]*' | while read dep; do
              local name
              name=$(basename "$dep")
              # Skip glibc/kernel ABI components that must come from the target system.
              # Also skip font-stack libs (fontconfig, freetype, expat, brotli, png, zlib):
              # bundling Ubuntu's fontconfig causes it to ignore the system's font cache and
              # rebuild from scratch on every launch, adding several minutes of startup delay.
              # These libraries are universally available on modern distros.
              case "$name" in
                linux-vdso*|ld-linux*|libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libresolv.so*) continue ;;
                libfontconfig*|libfreetype*|libexpat*|libbrotli*|libpng*|libz.so*) continue ;;
              esac
              if [ -f "$dep" ] && [ ! -f "AppDir/$name" ]; then
                cp "$dep" "AppDir/$name"
                echo "  bundled: $name (dep of $(basename $lib))"
                bundle_deps "$dep"
              fi
            done
          }

          echo "Bundling dependencies of libSkiaSharp.so:"
          bundle_deps AppDir/libSkiaSharp.so
          echo "Bundling dependencies of libHarfBuzzSharp.so:"
          bundle_deps AppDir/libHarfBuzzSharp.so

          # Patch RPATH on libSkiaSharp.so so it resolves ITS OWN deps from AppDir.
          # Also patch the app host and CLR so bare dlopen("libSkiaSharp") finds AppDir first.
          for f in AppDir/libSkiaSharp.so AppDir/libHarfBuzzSharp.so \
                    AppDir/tcg-proxy-builder AppDir/libcoreclr.so; do
            [ -f "$f" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$f" && \
              echo "Patched RPATH: $(basename $f)"
          done

          echo "AppDir .so count: $(ls AppDir/*.so 2>/dev/null | wc -l)"

      - name: Create icon
        run: |
          sudo apt-get install -y imagemagick
          # Use the bundled app icon, normalised to the 256x256 AppImage/freedesktop standard.
          convert MTGProxyBuilder.UI/Assets/icon.png -resize 256x256 \
            AppDir/mtg-proxy-builder.png

      - name: Create desktop file
        run: |
          cat > AppDir/mtg-proxy-builder.desktop << 'EOF'
          [Desktop Entry]
          Name=TCG Proxy Builder
          Comment=Create printable TCG proxy cards
          Exec=AppRun
          Icon=mtg-proxy-builder
          Type=Application
          Categories=Graphics;Game;
          StartupNotify=true
          EOF

      - name: Create AppRun
        run: |
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="$(dirname "$SELF")"
          export APPDIR="${APPDIR:-$HERE}"
          export LD_LIBRARY_PATH="${APPDIR}:${LD_LIBRARY_PATH}"
          # Force-preload bundled libSkiaSharp.so so the system version
          # (e.g. Arch/CachyOS libSkiaSharp.so.88) is never picked up.
          export LD_PRELOAD="${APPDIR}/libSkiaSharp.so${LD_PRELOAD:+:$LD_PRELOAD}"
          exec "${APPDIR}/tcg-proxy-builder" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          ARCH: x86_64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "TCGProxyBuilder-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "TCGProxyBuilder-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
