name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish
        run: >
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -o publish

      - name: Remove PDB files
        run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/* -DestinationPath "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

  build-linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish (native Linux)
        run: |
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -o publish

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          mkdir -p AppDir
          cp -r publish/* AppDir/

      - name: Create icon
        run: |
          sudo apt-get install -y imagemagick
          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#4a9eff' -font DejaVu-Sans-Bold -pointsize 52 \
            -gravity center -annotate 0 'MTG\nProxy' \
            AppDir/mtg-proxy-builder.png 2>/dev/null || \
          wget -q -O AppDir/mtg-proxy-builder.png \
            "https://via.placeholder.com/256/1a1a2e/4a9eff?text=MTG"

      - name: Create desktop file
        run: |
          cat > AppDir/mtg-proxy-builder.desktop << 'EOF'
          [Desktop Entry]
          Name=TCG Proxy Builder
          Comment=Create printable TCG proxy cards
          Exec=AppRun
          Icon=mtg-proxy-builder
          Type=Application
          Categories=Graphics;Game;
          StartupNotify=true
          EOF

      - name: Create AppRun
        run: |
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/tcg-proxy-builder" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          ARCH: x86_64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "TCGProxyBuilder-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "TCGProxyBuilder-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
