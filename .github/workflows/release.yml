name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish
        run: >
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -o publish

      - name: Remove PDB files
        run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/* -DestinationPath "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

  build-linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget libfontconfig1 libgl1

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=UI"

      - name: Publish (native Linux)
        run: |
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }} \
            -o publish

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          mkdir -p AppDir
          cp -r publish/* AppDir/
          if [ ! -f AppDir/libSkiaSharp.so ]; then
            SKIASO=$(find ~/.nuget/packages -name "libSkiaSharp.so" \
              -path "*/linux-x64/native/*" -path "*/3.119*/*" 2>/dev/null | head -1)
            [ -n "$SKIASO" ] && cp "$SKIASO" AppDir/libSkiaSharp.so || { echo "ERROR: libSkiaSharp.so not found"; exit 1; }
          fi

      - name: Bundle native dependencies and fix RPATH
        run: |
          sudo apt-get install -y patchelf

          # SkiaSharp.NativeAssets.Linux.NoDependencies (despite its name) dynamically
          # links against libfontconfig, libfreetype, libbrotli, libpng, etc.
          # On Arch/CachyOS these may be at different versions, causing libSkiaSharp.so
          # to fail to load silently and fall back to the system's old v88.
          #
          # Fix: bundle every non-glibc transitive dependency into AppDir, then patch
          # RPATH on libSkiaSharp.so (and key CLR binaries) to $ORIGIN so the bundled
          # versions are always found first, on any distro.

          bundle_deps() {
            local lib="$1"
            ldd "$lib" 2>/dev/null | grep -oP '/[^ ]+\.so[^ ]*' | while read dep; do
              local name
              name=$(basename "$dep")
              # Skip glibc/kernel components that must come from the target system
              case "$name" in
                linux-vdso*|ld-linux*|libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libresolv.so*) continue ;;
              esac
              if [ -f "$dep" ] && [ ! -f "AppDir/$name" ]; then
                cp "$dep" "AppDir/$name"
                echo "  bundled: $name (dep of $(basename $lib))"
                # Recurse one level for transitive deps of fontconfig etc.
                bundle_deps "$dep"
              fi
            done
          }

          echo "Bundling dependencies of libSkiaSharp.so:"
          bundle_deps AppDir/libSkiaSharp.so
          echo "Bundling dependencies of libHarfBuzzSharp.so:"
          bundle_deps AppDir/libHarfBuzzSharp.so

          # Patch RPATH on libSkiaSharp.so so it resolves ITS OWN deps from AppDir.
          # Also patch the app host and CLR so bare dlopen("libSkiaSharp") finds AppDir first.
          for f in AppDir/libSkiaSharp.so AppDir/libHarfBuzzSharp.so \
                    AppDir/tcg-proxy-builder AppDir/libcoreclr.so; do
            [ -f "$f" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$f" && \
              echo "Patched RPATH: $(basename $f)"
          done

          echo "AppDir .so count: $(ls AppDir/*.so 2>/dev/null | wc -l)"

      - name: Create icon
        run: |
          sudo apt-get install -y imagemagick
          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#4a9eff' -font DejaVu-Sans-Bold -pointsize 52 \
            -gravity center -annotate 0 'MTG\nProxy' \
            AppDir/mtg-proxy-builder.png 2>/dev/null || \
          wget -q -O AppDir/mtg-proxy-builder.png \
            "https://via.placeholder.com/256/1a1a2e/4a9eff?text=MTG"

      - name: Create desktop file
        run: |
          cat > AppDir/mtg-proxy-builder.desktop << 'EOF'
          [Desktop Entry]
          Name=TCG Proxy Builder
          Comment=Create printable TCG proxy cards
          Exec=AppRun
          Icon=mtg-proxy-builder
          Type=Application
          Categories=Graphics;Game;
          StartupNotify=true
          EOF

      - name: Patch RPATH into ELF binaries
        run: |
          sudo apt-get install -y patchelf
          # Bake $ORIGIN (= AppDir at runtime) into RPATH so the dynamic linker
          # searches AppDir for native libs before hitting the system ldconfig.
          # This works even when LD_PRELOAD / LD_LIBRARY_PATH are ignored.
          for f in AppDir/tcg-proxy-builder AppDir/libcoreclr.so; do
            [ -f "$f" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$f" && echo "Patched RPATH on $f" || true
          done

      - name: Create AppRun
        run: |
          printf '#!/bin/bash\nexport LD_LIBRARY_PATH="${APPDIR}:${LD_LIBRARY_PATH}"\nexec "${APPDIR}/tcg-proxy-builder" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          ARCH: x86_64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "TCGProxyBuilder-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "TCGProxyBuilder-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
