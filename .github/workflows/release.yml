name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      - name: Publish
        run: >
          dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -o publish

      - name: Remove PDB files
        run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: publish/tcg-proxy-builder.exe

      - name: Create Windows ZIP
        run: Compress-Archive -Path publish/* -DestinationPath "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip"

  build-appimage:
    runs-on: ubuntu-22.04
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 icoutils imagemagick wget

      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: windows-exe/

      - name: Download portable Wine
        run: |
          WINE_VERSION=$(curl -s https://api.github.com/repos/Kron4ek/Wine-Builds/releases/latest | jq -r .tag_name)
          echo "Using Wine ${WINE_VERSION}"
          wget -q "https://github.com/Kron4ek/Wine-Builds/releases/download/${WINE_VERSION}/wine-${WINE_VERSION}-amd64.tar.xz" \
            -O wine.tar.xz
          tar -xf wine.tar.xz
          mv "wine-${WINE_VERSION}-amd64" wine-portable

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          mkdir -p AppDir/wine
          cp windows-exe/tcg-proxy-builder.exe AppDir/
          cp -r wine-portable/* AppDir/wine/

      - name: Extract application icon
        run: |
          mkdir -p icons
          wrestool -x --output=icons/ -t14 windows-exe/tcg-proxy-builder.exe 2>/dev/null || true
          ICO_FILE=$(find icons/ -name "*.ico" | head -1)

          if [ -n "$ICO_FILE" ]; then
            convert "${ICO_FILE}" -thumbnail 256x256 -alpha on \
              -background none -flatten AppDir/mtg-proxy-builder.png 2>/dev/null || true
          fi

          if [ ! -s AppDir/mtg-proxy-builder.png ]; then
            convert -size 256x256 xc:'#1a1a2e' \
              -fill '#4a9eff' -font DejaVu-Sans-Bold -pointsize 52 \
              -gravity center -annotate 0 'MTG\nProxy' \
              AppDir/mtg-proxy-builder.png
          fi

      - name: Create desktop file
        run: |
          cat > AppDir/mtg-proxy-builder.desktop << 'EOF'
          [Desktop Entry]
          Name=MTG Proxy Builder
          Comment=Create printable TCG proxy cards
          Exec=AppRun
          Icon=mtg-proxy-builder
          Type=Application
          Categories=Graphics;Game;
          StartupNotify=true
          EOF

      - name: Create AppRun script
        run: |
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export WINEPREFIX="${HOME}/.local/share/mtg-proxy-builder/wine"
          export PATH="${HERE}/wine/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/wine/lib:${HERE}/wine/lib64:${LD_LIBRARY_PATH}"
          mkdir -p "${WINEPREFIX}"
          exec "${HERE}/wine/bin/wine64" "${HERE}/tcg-proxy-builder.exe" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "TCGProxyBuilder-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "TCGProxyBuilder-v${{ needs.build-windows.outputs.version }}-linux-x86_64.AppImage"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-appimage]
    permissions:
      contents: write

    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.AppImage
