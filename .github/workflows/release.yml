name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version: $VERSION"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests
      run: dotnet test --no-restore --verbosity normal

    - name: Publish
      run: >
        dotnet publish MTGProxyBuilder.UI/MTGProxyBuilder.UI.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:Version=${{ steps.version.outputs.version }}
        -p:AssemblyVersion=${{ steps.version.outputs.version }}
        -p:FileVersion=${{ steps.version.outputs.version }}
        -o publish

    - name: Remove PDB files
      run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue

    - name: Zip release
      run: Compress-Archive -Path publish/* -DestinationPath TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: TCGProxyBuilder-${{ github.ref_name }}-win-x64.zip
