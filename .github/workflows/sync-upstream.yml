name: Sync upstream

on:
  schedule:
    - cron: '0 2 * * *'  # 3:00 CET / 4:00 CEST ogni notte
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anubisascends/mtg-proxy-builder.git
          git fetch upstream

      - name: Check for new upstream commits
        id: check
        run: |
          NEW=$(git log HEAD..upstream/main --oneline)
          if [ -z "$NEW" ]; then
            echo "No new upstream commits — nothing to do"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$NEW" | wc -l)
            echo "${COUNT} new commit(s) from upstream:"
            echo "$NEW"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save fork-specific workflows
        if: steps.check.outputs.has_updates == 'true'
        run: |
          cp .github/workflows/release.yml       /tmp/release.yml.protected
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml.protected

      - name: Merge upstream (prefer upstream on conflicts)
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge upstream/main --no-ff -X theirs \
            -m "chore: sync with upstream anubisascends/mtg-proxy-builder"

      - name: Restore fork-specific workflows
        if: steps.check.outputs.has_updates == 'true'
        run: |
          CHANGED=false

          if ! diff -q /tmp/release.yml.protected .github/workflows/release.yml > /dev/null 2>&1; then
            cp /tmp/release.yml.protected .github/workflows/release.yml
            git add .github/workflows/release.yml
            CHANGED=true
          fi

          if ! diff -q /tmp/sync-upstream.yml.protected .github/workflows/sync-upstream.yml > /dev/null 2>&1; then
            cp /tmp/sync-upstream.yml.protected .github/workflows/sync-upstream.yml
            git add .github/workflows/sync-upstream.yml
            CHANGED=true
          fi

          if [ "$CHANGED" = "true" ]; then
            git commit -m "chore: preserve fork-specific workflows after upstream sync"
          fi

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin main
